from rivals.const import *
from rivals.models import *
import random
from faker import Faker
from persons.models import * 
from django.contrib.auth.models import User
fake = Faker()
for _ in range(100):
    while True:
        email = fake.unique.email()
        if not CustomUser.objects.filter(email=email).exists():
            break
    while True:
        first_name = fake.unique.first_name()
        if not CustomUser.objects.filter(first_name=first_name).exists():
            break
    while True:
        last_name = fake.unique.last_name()
        if not CustomUser.objects.filter(last_name=last_name).exists():
            break
    gender = random.choice(['M', 'F'])
    location = random.choice(TR_CITIES)
    preferred_city = location[0]
    preferred_geo = location[1][-2:]
    mobile = f'+{fake.random_int(1,999)}{fake.random_int(1000020,9999998)}'
    height = fake.random_int(160, 200)
    weight = fake.random_int(50, 110)
    tennis_exp_year = fake.random_int(1, 10)
    availability = fake.text(max_nb_chars=100)
    is_email_verified = fake.boolean(chance_of_getting_true=70)  # 70% вероятность, что email подтвержден
    is_new = fake.boolean(chance_of_getting_true=10)
    NTRP_current = fake.random_int(600, 3000)
    rating_pts = fake.random_int(1, 500)
    player_since = f'{fake.random_int(2010, 2025)}-{fake.random_int(1, 12)}-{fake.random_int(1, 28)}'
    avatar = random.choice(FEMALE_PLAYERS_AVATARS) if gender == 'F' else random.choice(MALE_PLAYERS_AVATARS)
    birthdate = f'{fake.random_int(1980, 2005)}-{fake.random_int(1, 12)}-{fake.random_int(1, 28)}'
    user = CustomUser.objects.create_user(
        username=email[:email.index('@')],
        first_name=first_name,
        last_name=last_name,
        email=email,
        password='123123',  # Рекомендуется изменить пароль по умолчанию позже
        mobile=mobile,
        preferred_city=preferred_city,
        preferred_geo=preferred_geo,
        is_email_verified=is_email_verified,
        is_player=True,
        is_author=False
    )
    Player.objects.create(
        user_id=user.id,
        gender=gender,
        city=preferred_city,
        geo=preferred_geo,
        birthdate=birthdate,
        height=height,
        weight=weight,
        tennis_exp_year=tennis_exp_year,
        availability=availability,
        is_new=is_new,
        NTRP_current=NTRP_current,
        rating_pts=rating_pts,
        player_since=player_since,
        avatar=avatar,
    )
print("Создание 100 записей CustomUser и связанных Player завершено.")