{# GA4 purchase — order (SalesOrder with lines + product) #}
{% load l10n %}
<script>
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ ecommerce: null });
  window.dataLayer.push({
    event: 'purchase',
    transaction_id: '{{ order.invoice_number|escapejs }}',
    currency: 'GEL',
    value: {{ order.gross_total|unlocalize }},
    ecommerce: {
      transaction_id: '{{ order.invoice_number|escapejs }}',
      currency: 'GEL',
      value: {{ order.gross_total|unlocalize }},
      items: [
        {% for line in order.lines.all %}
        {
          item_id: "{{ line.product.sku|default:line.product.pk|escapejs }}",
          item_name: "{{ line.product.name|escapejs }}",
          item_brand: "{{ line.product.brand|default:''|escapejs }}",
          item_category: "{{ line.product.get_type_display|escapejs }}",
          price: {{ line.unit_price_gross|unlocalize }},
          quantity: {{ line.quantity }}
        }{% if not forloop.last %},{% endif %}
        {% endfor %}
      ]
    }
  });
</script>
