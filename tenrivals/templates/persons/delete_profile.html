{% extends "default.html" %}
{% load i18n %}

{% block content %}
<div id="layoutAuthentication">
    <div id="layoutAuthentication_content">
        <main>
            <div class="container-xl px-4">
                <div class="row justify-content-center">
                    <div class="col-lg-5">
                        <div class="card shadow-lg border-0 rounded-lg mt-5">
                            <div class="card-header justify-content-center">
                                <h3 class="fw-light my-4">{% trans "Delete Profile" %}</h3>
                            </div>
                            <div class="card-body">
                                <div class="alert alert-danger">
                                    <h5 class="alert-heading">Warning!</h5>
                                    <p>You are about to delete your profile. This action cannot be undone.</p>
                                    <hr>
                                    <p class="mb-0">All your data will be permanently removed.</p>
                                </div>

                                <form method="post">
                                    {% csrf_token %}
                                    
                                    <div class="mb-3">
                                        <div class="form-check">
                                            <input class="form-check-input" 
                                                   type="checkbox" 
                                                   name="confirm_delete" 
                                                   value="yes" 
                                                   id="confirmDelete" 
                                                   required>
                                            <label class="form-check-label" for="confirmDelete">
                                                I understand that this action cannot be undone
                                            </label>
                                        </div>
                                    </div>

                                    <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                                        <a class="btn btn-light" href="{% url 'rivals:player_details' %}">Cancel</a>
                                        <button class="btn btn-danger" type="submit">Delete Profile</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
{% endblock %}
