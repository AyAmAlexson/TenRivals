<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="/static/css/styles.css" rel="stylesheet">
  <style>
    body{margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial,sans-serif; color:#0f172a;}
    .wrap{min-height:100dvh; display:grid; place-items:center; background:linear-gradient(135deg,#0e8b84 0%, #52b6ad 60%, #e8f7f6 100%);}    
    .card{background:#ffffff; padding:32px 28px; border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.12); text-align:center; width:min(520px,92vw)}
    .logo{height:56px; width:auto; display:block; margin:0 auto 14px auto}
    h1{margin:8px 0 10px 0; font-size:28px}
    p{margin:0 0 18px 0; color:#475569}
    .btn{display:inline-flex; align-items:center; gap:10px; padding:12px 18px; border-radius:10px; text-decoration:none; color:#0e8b84; border:2px solid #0e8b84; background:#fff; font-weight:600}
    .btn:hover{background:#0e8b84; color:#fff}
  </style>
  {% load static %}
  {% load url from future %}
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img class="logo" src="{% static 'assets/img/TR Logo 25/TRLogo_rect_white_on_teal_shop.png' %}" alt="TR Shop">
      <h1>Shop</h1>
      <p>All products are temporarily available via Preorder page.</p>
      <a class="btn" href="{% url 'shop:preorder' %}">Go to Preorder →</a>
    </div>
  </div>
</body>
</html>
