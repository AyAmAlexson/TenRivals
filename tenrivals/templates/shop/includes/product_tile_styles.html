{# Shared catalog + home product tiles (Holabird-style: square photo, copy on page background). #}
<style>
  .product-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:28px 24px}
  .product-tile{position:relative; min-width:0}
  .product-tile__edit{
    position:absolute; top:8px; right:8px; z-index:3;
    display:inline-flex; align-items:center; justify-content:center;
    width:32px; height:32px; padding:0; text-decoration:none;
    background:rgba(255,255,255,.9); border:1px solid #d1d5db; border-radius:50%;
    color:#9ca3af;
  }
  .product-tile__edit svg{width:15px; height:15px}
  .product-tile__edit:hover{border-color:#9ca3af; color:#6b7280; background:#fff}
  .product-tile__link{
    display:block; text-decoration:none; color:inherit;
    transition:opacity .15s;
  }
  .product-tile__link:hover{opacity:.92}
  .product-tile__link:hover .product-tile__title{color:var(--tile-accent, #B20009)}
  .product-tile__media{
    aspect-ratio:1/1;
    background:var(--tile-photo-bg, #fff);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .product-tile__media img{
    width:100%; height:100%; object-fit:contain; object-position:center;
    display:block;
  }
  .product-tile__meta{padding:14px 0 0; background:transparent}
  .product-tile__title{
    font-size:14px; font-weight:400; line-height:1.35; color:var(--tile-ink, #1a1a1a);
    margin:0 0 6px; text-transform:none; letter-spacing:.01em;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .product-tile__brand{font-weight:600}
  .product-tile__color{
    font-size:13px; font-weight:400; line-height:1.4; color:var(--tile-muted, #64748b);
    margin:0 0 4px; text-transform:none;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .product-tile__color:empty{display:none}
  .product-tile__category{
    font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    color:var(--tile-cat, #94a3b8); margin:0 0 8px;
  }
  .product-tile__prices{display:flex; align-items:baseline; flex-wrap:wrap; gap:6px 10px}
  .product-tile__price{font-size:14px; font-weight:800; color:var(--tile-accent, #B20009); letter-spacing:0}
  .product-tile__price-old{font-size:13px; color:#94a3b8; text-decoration:line-through}
  .product-tile__price-muted{font-size:13px; font-weight:400; color:var(--tile-muted, #64748b); text-transform:none}
  @media(max-width:1024px){
    .product-grid{grid-template-columns:repeat(3, 1fr); gap:22px 18px}
  }
  @media(max-width:768px){
    .product-grid{grid-template-columns:repeat(2, 1fr); gap:18px 14px}
  }
  @media(max-width:640px){
    .product-grid{grid-template-columns:repeat(2, 1fr); gap:14px 12px}
    .product-tile__meta{padding-top:10px}
    .product-tile__title{font-size:13px}
  }
</style>
