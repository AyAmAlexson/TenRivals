{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Error{% endblock %} · Tennis Rivals Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="icon" href="{% static 'assets/img/favicon.png' %}">
  <link href="{% static 'css/styles.css' %}" rel="stylesheet">
  <style>
    :root { --accent:#B20009; --accent-dark:#8E0007; --ink:#1a1a1a; --muted:#64748b; }
    body { margin:0; font-family:'Saira',system-ui,sans-serif; color:var(--ink); background:#fff; }
    .error-wrap { padding:72px 20px; max-width:520px; margin:0 auto; text-align:center; }
    .error-wrap img { margin:0 auto 28px; max-width:220px; height:auto; }
    h1 { font-size:clamp(22px,4vw,28px); font-weight:800; text-transform:uppercase; letter-spacing:.06em; margin:0 0 12px; }
    p { color:var(--muted); line-height:1.55; margin:0 0 24px; font-size:15px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; padding:12px 22px; font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:.1em; background:var(--accent); color:#fff; text-decoration:none; border-radius:0; transition:background .15s; }
    .btn:hover { background:var(--accent-dark); color:#fff; }
    .btn--secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); margin-left:10px; }
    .btn--secondary:hover { background:var(--accent); color:#fff; }
  </style>
</head>
<body>
  <div class="error-wrap">
    <a href="{% url 'shop:index' %}">
      <img src="{% static 'assets/img/TR Logo 25/TR 25 LOGO HOR RED.svg' %}" width="220" height="auto" alt="Tennis Rivals Shop">
    </a>
    {% block body %}{% endblock %}
  </div>
</body>
</html>
